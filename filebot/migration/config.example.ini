# 数据迁移配置文件
# 支持多种源数据库：oracle, mssql, sybase, hsqldb, mysql

[source]
# 数据库类型：oracle, mssql, sybase, hsqldb, mysql
type = oracle

# 通用连接参数
host = localhost
port = 
database = smarti
schema = 
username = 
password = 

# Oracle 特定
# service_name = ORCL
# sid = 

# MS SQL Server 特定
# instance = MSSQLSERVER
# encrypt = yes
# trust_server_certificate = no

# Sybase 特定
# charset = utf8

[target]
# 目标数据库 (SQLite)
database = ../filebot.db

[paths]
# 文件路径
file_storage = ../data/files
temp_storage = ../data/temp

[migration]
# 迁移模式：full（全量）, incremental（增量）
mode = full

# 增量迁移配置（mode=incremental时生效）
incremental.interval_minutes = 5
incremental.last_id_file = ./last_migration_state.json

# 性能配置
batch_size = 1000
max_workers = 4

[logging]
level = INFO
file = ./migration.log
console = yes