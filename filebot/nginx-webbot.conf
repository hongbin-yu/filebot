# WebBot 统一入口 — HTTPS + IP 白名单 → Vite 代理 → 后端
# 放在 /etc/nginx/sites-available/webbot 然后 ln -s 到 sites-enabled/

# 速率限制：每秒 50 请求
limit_req_zone $binary_remote_addr zone=webbot_limit:10m rate=50r/s;

server {
    listen 443 ssl http2;
    server_name _;

    # === SSL 证书（复用已有的自签证书）===
    ssl_certificate     /tmp/filebot-cert.pem;
    ssl_certificate_key /tmp/filebot-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # === IP 白名单 ===
    # 本地 / 局域网 / WSL2 — 始终放行
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    # ★ 在这里添加允许的外部 IP
    # allow YOUR_PUBLIC_IP;
    # 其余全部拒绝
    allow 174.112.193.81;  # 老板
    deny all;

    # === 速率限制 ===
    limit_req zone=webbot_limit burst=30 nodelay;

    # === FileBot 专用 API（不走 Vite，直连 8001）===
    location /api/v1/import-page {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # CORS（支持 bookmarklet 从 HTTPS 页面调用）
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # OPTIONS preflight — 本地响应
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }
    }

    location /api/health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === 代理到 Vite（Vite 内部 proxy 配置负责路由到 8000/8001/8003）===
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;

        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（Vite HMR 需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓存关闭（开发阶段）
        proxy_buffering off;
    }
}
