<!doctype html>
<html class="no-js" lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>frontend</title>
    <!-- Canada.ca WET/GCWeb theme CSS -->
    <link rel="stylesheet" href="/etc/designs/canada/wet-boew/css/theme.min.css" />
    <link rel="stylesheet" href="/etc/designs/canada/wet-boew/css/noscript.min.css" />
    <style id="font-override">
      body { font-family: "Noto Sans", sans-serif; font-size: 15px !important; color: #333; }
      h1 { font-size: 28px !important; }
      h2 { font-size: 22px !important; }
      h3 { font-size: 18px !important; }
      .rdt_TableCell { font-size: 13px !important; }
      /* 文档标题行 */
      .font-medium.text-gray-900 { font-size: 16px !important; }
      /* Create Root Folder / Create Subfolder 按钮 */
      .flex.space-x-2 button span { font-size: 14px !important; }
      /* 左侧菜单：文件夹名称、Folders/AI标题 */
      [class*="w-1/3"] h3 { font-size: 18px !important; }
      [class*="w-1/3"] .font-medium:not(h3) { font-size: 16px !important; }
      [class*="w-1/3"] .text-sm { font-size: 12px !important; }
    </style>
  </head>
  <body vocab="http://schema.org/" typeof="WebPage">
    <div id="root"></div>
    <!-- WET/GCWeb JavaScript (jQuery → WET-BOEW → GCWeb theme) -->
    <script src="/etc/designs/canada/wet-boew/js/jquery/2.2.4/jquery.min.js"></script>
    <script src="/etc/designs/canada/wet-boew/js/wet-boew.min.js"></script>
    <script src="/etc/designs/canada/wet-boew/js/theme.min.js"></script>
    <script src="/wet-dialogs.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
