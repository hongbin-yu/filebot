<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 模块导出验证测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .test-section {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border-left: 5px solid;
        }
        .test-success {
            border-left-color: #4CAF50;
        }
        .test-error {
            border-left-color: #F44336;
        }
        .test-warning {
            border-left-color: #FF9800;
        }
        .test-info {
            border-left-color: #2196F3;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-right: 10px;
        }
        .success { background: #4CAF50; }
        .error { background: #F44336; }
        .warning { background: #FF9800; }
        .info { background: #2196F3; }
        .code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .action-btn {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .action-btn:active {
            transform: translateY(0);
        }
        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.5s ease;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .server-status {
            text-align: center;
            margin: 30px 0;
        }
        .server-status h3 {
            margin-bottom: 15px;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 模块导出验证测试</h1>
        
        <div class="server-status">
            <h3>服务器状态检查</h3>
            <div id="server-status" class="result">正在检查...</div>
        </div>

        <div class="progress">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="test-grid">
            <!-- 测试1: ES模块系统 -->
            <div class="test-section test-info">
                <h3><span class="status info">1</span> ES模块系统测试</h3>
                <p>验证浏览器的ES模块支持</p>
                <button class="action-btn" onclick="testESModules()">运行测试</button>
                <div id="es-module-result" class="result">等待测试...</div>
            </div>

            <!-- 测试2: auth.service.ts 导出 -->
            <div class="test-section test-warning">
                <h3><span class="status warning">2</span> auth.service.ts 导出验证</h3>
                <p>检查 <span class="code">/src/services/auth.service.ts</span> 的导出</p>
                <button class="action-btn" onclick="testAuthService()">检查导出</button>
                <div id="auth-service-result" class="result">等待测试...</div>
            </div>

            <!-- 测试3: 手动导入测试 -->
            <div class="test-section test-error">
                <h3><span class="status error">3</span> 手动导入测试</h3>
                <p>模拟Navbar.tsx的导入方式</p>
                <button class="action-btn" onclick="testManualImport()">模拟导入</button>
                <div id="manual-import-result" class="result">等待测试...</div>
            </div>

            <!-- 测试4: 模块缓存检查 -->
            <div class="test-section test-info">
                <h3><span class="status info">4</span> 模块缓存检查</h3>
                <p>检查Service Worker和模块缓存</p>
                <button class="action-btn" onclick="testModuleCache()">检查缓存</button>
                <div id="cache-result" class="result">等待测试...</div>
            </div>
        </div>

        <!-- 测试5: 完整诊断 -->
        <div class="test-section test-success">
            <h3><span class="status success">5</span> 完整系统诊断</h3>
            <p>执行所有测试，生成完整报告</p>
            <button class="action-btn" onclick="runFullDiagnosis()">运行完整诊断</button>
            <div id="full-diagnosis-result" class="result">等待诊断...</div>
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="action-btn" style="background: linear-gradient(45deg, #9C27B0, #E91E63);" onclick="clearConsole()">清理控制台</button>
            <button class="action-btn" style="background: linear-gradient(45deg, #FF9800, #FF5722);" onclick="copyResults()">复制结果</button>
            <button class="action-btn" style="background: linear-gradient(45deg, #4CAF50, #2E7D32);" onclick="location.reload()">刷新页面</button>
        </div>
    </div>

    <script>
        // 更新进度条
        function updateProgress(percent) {
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        // 检查服务器状态
        async function checkServerStatus() {
            const statusDiv = document.getElementById('server-status');
            try {
                const response = await fetch('/');
                if (response.ok) {
                    statusDiv.innerHTML = `<span class="status success">✅ 服务器运行正常</span><br>端口: ${window.location.port}<br>响应: HTTP ${response.status}`;
                } else {
                    statusDiv.innerHTML = `<span class="status error">❌ 服务器异常</span><br>响应: HTTP ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="status error">❌ 服务器连接失败</span><br>错误: ${error.message}`;
            }
        }

        // 测试1: ES模块系统
        async function testESModules() {
            updateProgress(20);
            const resultDiv = document.getElementById('es-module-result');
            resultDiv.innerHTML = '正在测试ES模块支持...';
            
            try {
                // 测试动态导入
                const testModule = await import('/src/services/auth.service.ts');
                resultDiv.innerHTML = `<span class="status success">✅ ES模块支持正常</span><br>
模块加载成功！<br>
模块导出键: ${Object.keys(testModule).join(', ')}<br>
模块内容: ${JSON.stringify(testModule, null, 2)}`;
            } catch (error) {
                resultDiv.innerHTML = `<span class="status error">❌ ES模块加载失败</span><br>
错误类型: ${error.constructor.name}<br>
错误信息: ${error.message}<br>
错误详情: ${error.stack || '无堆栈信息'}`;
            }
        }

        // 测试2: auth.service.ts 导出验证
        async function testAuthService() {
            updateProgress(40);
            const resultDiv = document.getElementById('auth-service-result');
            resultDiv.innerHTML = '正在检查auth.service.ts导出...';
            
            try {
                // 尝试不同导入方式
                const module1 = await import('/src/services/auth.service.ts');
                
                // 检查导出内容
                const exportKeys = Object.keys(module1);
                const hasDefault = 'default' in module1;
                const hasAuthService = 'authService' in module1;
                
                resultDiv.innerHTML = `<span class="${hasDefault ? 'success' : 'error'}">${hasDefault ? '✅' : '❌'} 默认导出: ${hasDefault ? '存在' : '不存在'}</span><br>
<span class="${hasAuthService ? 'warning' : 'info'}">${hasAuthService ? '⚠️' : 'ℹ️'} 命名导出(authService): ${hasAuthService ? '存在' : '不存在'}</span><br>
所有导出键: ${exportKeys.join(', ')}<br><br>
<strong>模块分析:</strong><br>
${hasDefault ? '✅ 模块使用默认导出 (export default)' : '❌ 模块缺少默认导出'}<br>
${hasAuthService ? '⚠️ 模块包含命名导出 "authService"，这可能导致冲突' : '✅ 模块不包含命名导出 "authService"'}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<span class="status error">❌ 模块检查失败</span><br>
错误: ${error.message}<br>
建议: ${error.message.includes('does not provide an export') ? '模块导出不匹配，检查代码中的导入/导出语句' : '模块文件可能不存在或路径错误'}`;
            }
        }

        // 测试3: 手动导入测试 (模拟Navbar.tsx)
        async function testManualImport() {
            updateProgress(60);
            const resultDiv = document.getElementById('manual-import-result');
            resultDiv.innerHTML = '正在模拟Navbar.tsx导入...<br>模拟代码: <span class="code">import authService from \'../../services/auth.service\';</span>';
            
            try {
                // 模拟不同的导入方式
                const importPaths = [
                    '../../services/auth.service',
                    '/src/services/auth.service.ts',
                    '../../services/auth.service.ts'
                ];
                
                let results = [];
                for (const path of importPaths) {
                    try {
                        const module = await import(path);
                        results.push(`✅ ${path}: 成功导入, 导出键: ${Object.keys(module).join(', ')}`);
                    } catch (error) {
                        results.push(`❌ ${path}: ${error.message}`);
                    }
                }
                
                resultDiv.innerHTML = `<span class="status info">导入测试结果:</span><br>${results.join('<br>')}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<span class="status error">❌ 导入测试失败</span><br>错误: ${error.message}`;
            }
        }

        // 测试4: 模块缓存检查
        async function testModuleCache() {
            updateProgress(80);
            const resultDiv = document.getElementById('cache-result');
            resultDiv.innerHTML = '正在检查模块缓存...';
            
            try {
                const cacheStatus = [];
                
                // 检查Service Worker
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    cacheStatus.push(`Service Worker: ${registrations.length}个注册`);
                    
                    for (const reg of registrations) {
                        cacheStatus.push(`  - ${reg.scope}: ${reg.active ? '活跃' : '非活跃'}`);
                    }
                } else {
                    cacheStatus.push('Service Worker: 不支持');
                }
                
                // 检查IndexedDB
                const dbs = await indexedDB.databases ? await indexedDB.databases() : [];
                cacheStatus.push(`IndexedDB: ${dbs.length}个数据库`);
                
                // 检查缓存API
                if ('caches' in window) {
                    const cacheKeys = await caches.keys();
                    cacheStatus.push(`Cache Storage: ${cacheKeys.length}个缓存`);
                }
                
                resultDiv.innerHTML = `<span class="status info">缓存状态:</span><br>${cacheStatus.join('<br>')}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<span class="status warning">⚠️ 缓存检查出错</span><br>错误: ${error.message}`;
            }
        }

        // 测试5: 完整诊断
        async function runFullDiagnosis() {
            updateProgress(0);
            const resultDiv = document.getElementById('full-diagnosis-result');
            resultDiv.innerHTML = '开始完整系统诊断...';
            
            const diagnosis = [];
            
            // 1. 检查服务器
            try {
                const response = await fetch('/');
                diagnosis.push(`✅ 服务器: HTTP ${response.status}`);
            } catch (error) {
                diagnosis.push(`❌ 服务器: ${error.message}`);
            }
            updateProgress(20);
            
            // 2. 检查模块导出
            try {
                const module = await import('/src/services/auth.service.ts');
                const hasDefault = 'default' in module;
                const hasAuthService = 'authService' in module;
                
                diagnosis.push(`${hasDefault ? '✅' : '❌'} 默认导出: ${hasDefault}`);
                diagnosis.push(`${hasAuthService ? '⚠️' : '✅'} 命名导出(authService): ${hasAuthService}`);
            } catch (error) {
                diagnosis.push(`❌ 模块检查: ${error.message}`);
            }
            updateProgress(40);
            
            // 3. 检查控制台错误
            const originalConsoleError = console.error;
            let consoleErrors = [];
            console.error = function(...args) {
                consoleErrors.push(args.join(' '));
                originalConsoleError.apply(console, args);
            };
            
            // 触发一些可能的错误
            setTimeout(() => {
                diagnosis.push(`控制台错误: ${consoleErrors.length}个`);
                if (consoleErrors.length > 0) {
                    diagnosis.push('最近错误: ' + consoleErrors[0]);
                }
                console.error = originalConsoleError;
            }, 100);
            
            updateProgress(60);
            
            // 4. 检查浏览器环境
            diagnosis.push(`浏览器: ${navigator.userAgent.split(' ')[0]}`);
            diagnosis.push(`ES模块: ${'noModule' in HTMLScriptElement.prototype ? '支持' : '不支持'}`);
            diagnosis.push(`动态导入: ${'import' in Function.prototype ? '支持' : '不支持'}`);
            
            updateProgress(80);
            
            // 5. 检查URL和端口
            diagnosis.push(`当前URL: ${window.location.href}`);
            diagnosis.push(`端口: ${window.location.port}`);
            
            updateProgress(100);
            
            resultDiv.innerHTML = `<span class="status success">完整诊断完成</span><br>${diagnosis.join('<br>')}`;
        }

        // 工具函数
        function clearConsole() {
            console.clear();
            wetAlert('控制台已清理');
        }
        
        function copyResults() {
            const results = [];
            const resultDivs = document.querySelectorAll('.result');
            resultDivs.forEach(div => {
                results.push(div.textContent);
            });
            
            navigator.clipboard.writeText(results.join('\n\n'))
                .then(() => wetAlert('结果已复制到剪贴板'))
                .catch(err => wetAlert('复制失败: ' + err));
        }

        // 页面加载时自动运行一些检查
        window.addEventListener('load', () => {
            checkServerStatus();
            updateProgress(10);
        });
    </script>
</body>
</html>
