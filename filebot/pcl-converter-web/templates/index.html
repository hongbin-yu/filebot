<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .upload-area {
            border: 3px dashed #3498db;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }
        
        .upload-area:hover, .upload-area.dragover {
            background-color: #e8f4fc;
            border-color: #2980b9;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #34495e;
        }
        
        .file-input {
            display: none;
        }
        
        .browse-btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s;
            border: none;
        }
        
        .browse-btn:hover {
            background-color: #2980b9;
        }
        
        .selected-file {
            margin-top: 20px;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 5px;
            display: none;
        }
        
        .selected-file.show {
            display: block;
        }
        
        .file-name {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .conversion-method {
            margin-bottom: 30px;
        }
        
        .method-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .method-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .method-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .convert-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            transition: background-color 0.3s;
            margin-bottom: 30px;
        }
        
        .convert-btn:hover:not(:disabled) {
            background-color: #219653;
        }
        
        .convert-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .progress-container {
            display: none;
            margin-bottom: 30px;
        }
        
        .progress-container.show {
            display: block;
        }
        
        .progress-label {
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .progress-bar {
            height: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .result-container {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
        }
        
        .result-container.success {
            display: block;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result-container.error {
            display: block;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .download-btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        
        .download-btn:hover {
            background-color: #219653;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: 600;
        }
        
        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .api-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        
        .status-online {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>File Converter</h1>
            <p class="subtitle">多格式文件转PDF转换器</p>
        </header>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <p class="upload-text">拖放文件到此处，或点击选择文件</p>
            <button class="browse-btn" onclick="document.getElementById('fileInput').click()">浏览文件</button>
            <input type="file" id="fileInput" class="file-input" accept=".pcl" onchange="handleFileSelect(event)">
        </div>
        
        <div class="selected-file" id="selectedFile">
            <div class="file-name" id="fileName">未选择文件</div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <div class="conversion-method">
            <label class="method-label">转换方式:</label>
            <div class="method-options">
                <label class="method-option">
                    <input type="radio" name="conversionMethod" value="filebot" checked>
                    <span>使用FileBot后端API</span>
                </label>
                <label class="method-option">
                    <input type="radio" name="conversionMethod" value="direct">
                    <span>直接调用pcltopdf命令行</span>
                </label>
            </div>
        </div>
        
        <button class="convert-btn" id="convertBtn" onclick="convertFile()" disabled>开始转换</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-label">转换进度</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="result-container" id="resultContainer"></div>
        
        <div class="status-message" id="statusMessage"></div>
        
        <footer>
            <p>FileBot Phase 2C - File Converter</p>
            <p>API状态: 
                <span id="apiStatusText">检查中...</span>
                <span class="api-status" id="apiStatusIndicator"></span>
            </p>
        </footer>
    </div>
    
    <script>
        // 全局变量
        let selectedFile = null;
        let conversionInProgress = false;
        
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const selectedFileDiv = document.getElementById('selectedFile');
        const fileNameSpan = document.getElementById('fileName');
        const fileSizeSpan = document.getElementById('fileSize');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const resultContainer = document.getElementById('resultContainer');
        const statusMessage = document.getElementById('statusMessage');
        const apiStatusText = document.getElementById('apiStatusText');
        const apiStatusIndicator = document.getElementById('apiStatusIndicator');
        
        // 检查API状态
        function checkApiStatus() {
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'healthy') {
                        apiStatusText.textContent = '在线';
                        apiStatusIndicator.textContent = '✓';
                        apiStatusIndicator.className = 'api-status status-online';
                    } else {
                        apiStatusText.textContent = '异常';
                        apiStatusIndicator.textContent = '✗';
                        apiStatusIndicator.className = 'api-status status-offline';
                    }
                })
                .catch(error => {
                    apiStatusText.textContent = '离线';
                    apiStatusIndicator.textContent = '✗';
                    apiStatusIndicator.className = 'api-status status-offline';
                });
        }
        
        // 文件选择处理
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                processFile(file);
            }
        }
        
        // 处理文件
        function processFile(file) {
            // 验证文件类型
            const allowedExtensions = ['.pcl', '.tiff', '.tif', '.jpg', '.jpeg', '.png', '.txt', '.text'];
            const fileExt = file.name.toLowerCase().slice(file.name.lastIndexOf('.'));
            if (!allowedExtensions.includes(fileExt)) {
                showStatus('只支持 .pcl, .tiff, .tif, .jpg, .jpeg, .png, .txt, .text 文件格式', 'error');
                return;
            }
            
            // 验证文件大小（最大100MB）
            if (file.size > 100 * 1024 * 1024) {
                showStatus('文件太大（最大100MB）', 'error');
                return;
            }
            
            selectedFile = file;
            
            // 显示文件信息
            fileNameSpan.textContent = file.name;
            fileSizeSpan.textContent = formatFileSize(file.size);
            selectedFileDiv.classList.add('show');
            
            // 启用转换按钮
            convertBtn.disabled = false;
            
            showStatus('文件已选择，准备转换', 'success');
        }
        
        // 拖放功能
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;
                processFile(file);
            }
        });
        
        // 文件大小格式化
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 显示状态消息
        function showStatus(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            
            if (type === 'success') {
                statusMessage.classList.add('status-success');
            } else if (type === 'error') {
                statusMessage.classList.add('status-error');
            }
            
            // 5秒后自动清除
            setTimeout(() => {
                statusMessage.textContent = '';
                statusMessage.className = 'status-message';
            }, 5000);
        }
        
        // 转换文件
        function convertFile() {
            if (!selectedFile || conversionInProgress) return;
            
            // 获取转换方式
            const conversionMethod = document.querySelector('input[name="conversionMethod"]:checked').value;
            
            // 重置UI
            resultContainer.style.display = 'none';
            resultContainer.className = 'result-container';
            
            // 显示进度条
            progressContainer.classList.add('show');
            progressFill.style.width = '0%';
            
            // 禁用按钮
            convertBtn.disabled = true;
            conversionInProgress = true;
            
            // 模拟进度更新
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 5;
                progressFill.style.width = progress + '%';
                
                if (progress >= 90) {
                    clearInterval(progressInterval);
                }
            }, 200);
            
            // 创建FormData
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('conversion_method', conversionMethod);
            
            // 发送请求
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                
                if (data.success) {
                    // 显示成功结果
                    resultContainer.innerHTML = `
                        <div class="result-title">✅ 转换成功!</div>
                        <p>文件 <strong>${data.original_filename}</strong> 已成功转换为PDF。</p>
                        <a href="${data.download_url}" class="download-btn" download="${data.converted_filename}">
                            下载 ${data.converted_filename}
                        </a>
                    `;
                    resultContainer.classList.add('success');
                    resultContainer.style.display = 'block';
                    
                    showStatus('转换成功！请下载PDF文件', 'success');
                } else {
                    // 显示错误
                    resultContainer.innerHTML = `
                        <div class="result-title">❌ 转换失败</div>
                        <p>${data.error || '未知错误'}</p>
                    `;
                    resultContainer.classList.add('error');
                    resultContainer.style.display = 'block';
                    
                    showStatus(`转换失败: ${data.error}`, 'error');
                }
                
                // 重置状态
                conversionInProgress = false;
                convertBtn.disabled = false;
                
                // 3秒后隐藏进度条
                setTimeout(() => {
                    progressContainer.classList.remove('show');
                }, 3000);
            })
            .catch(error => {
                clearInterval(progressInterval);
                
                resultContainer.innerHTML = `
                    <div class="result-title">❌ 网络错误</div>
                    <p>${error.message || '连接服务器失败'}</p>
                `;
                resultContainer.classList.add('error');
                resultContainer.style.display = 'block';
                
                showStatus('网络错误，请检查连接', 'error');
                
                conversionInProgress = false;
                convertBtn.disabled = false;
                progressContainer.classList.remove('show');
            });
        }
        
        // 页面加载时检查API状态
        document.addEventListener('DOMContentLoaded', () => {
            checkApiStatus();
            // 每分钟检查一次API状态
            setInterval(checkApiStatus, 60000);
        });
    </script>
</body>
</html>
