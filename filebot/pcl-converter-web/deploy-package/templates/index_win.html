<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCL转PDF转换器 - Windows版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #3498db, #2c3e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }
        
        .card-title {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        .card-content {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .status-online { color: #27ae60; }
        .status-warning { color: #f39c12; }
        .status-offline { color: #e74c3c; }
        
        .upload-area {
            border: 3px dashed #3498db;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            margin: 30px 0;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            cursor: pointer;
        }
        
        .upload-area:hover, .upload-area.dragover {
            background-color: #e8f4fc;
            border-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .upload-icon {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #34495e;
        }
        
        .browse-btn {
            display: inline-block;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        .browse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .selected-file {
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            border-radius: 10px;
            display: none;
            align-items: center;
            gap: 15px;
        }
        
        .selected-file.show {
            display: flex;
        }
        
        .file-icon {
            font-size: 32px;
            color: #3498db;
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .tools-section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .tools-title {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .tool-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        
        .tool-card.available {
            border-color: #27ae60;
            background-color: #f0f9f0;
        }
        
        .tool-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .tool-status {
            font-size: 0.9rem;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        
        .status-available {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-unavailable {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .convert-btn {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #27ae60, #219653);
            color: white;
            padding: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s;
            margin: 30px 0;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
        }
        
        .convert-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-container {
            display: none;
            margin: 30px 0;
        }
        
        .progress-container.show {
            display: block;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .progress-label {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .progress-percent {
            font-weight: bold;
            color: #3498db;
        }
        
        .progress-bar {
            height: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #3498db, #2980b9);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .result-container {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-container.success {
            display: block;
            background: linear-gradient(45deg, #d4edda, #c3e6cb);
            border: 2px solid #27ae60;
            color: #155724;
        }
        
        .result-container.error {
            display: block;
            background: linear-gradient(45deg, #f8d7da, #f5c6cb);
            border: 2px solid #e74c3c;
            color: #721c24;
        }
        
        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .result-icon {
            font-size: 32px;
        }
        
        .result-title {
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, #27ae60, #219653);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideInRight 0.5s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .notification.success {
            background: linear-gradient(45deg, #27ae60, #219653);
        }
        
        .notification.error {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        
        .notification.info {
            background: linear-gradient(45deg, #3498db, #2980b9);
        }
        
        .file-input {
            display: none;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 20px auto;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 PCL转PDF转换器</h1>
            <p class="subtitle">Windows优化版 - 支持多种PCL转换工具</p>
        </header>
        
        <div class="dashboard">
            <div class="dashboard-card">
                <div class="card-title">系统平台</div>
                <div class="card-content" id="platformInfo">检测中...</div>
            </div>
            <div class="dashboard-card">
                <div class="card-title">检测到工具</div>
                <div class="card-content" id="toolsCount">检测中...</div>
            </div>
            <div class="dashboard-card">
                <div class="card-title">服务状态</div>
                <div class="card-content status-online" id="serviceStatus">运行中</div>
            </div>
        </div>
        
        <div class="tools-section">
            <div class="tools-title">
                <span>🛠️ 可用的PCL转换工具</span>
                <button class="browse-btn" style="padding: 5px 15px; font-size: 0.9rem;" onclick="refreshTools()">
                    刷新检测
                </button>
            </div>
            <div class="tools-grid" id="toolsGrid">
                <div class="tool-card">
                    <div class="tool-name">GhostPCL (gpcl6)</div>
                    <div class="tool-status status-unavailable">未检测到</div>
                </div>
                <div class="tool-card">
                    <div class="tool-name">PCL6</div>
                    <div class="tool-status status-unavailable">未检测到</div>
                </div>
                <div class="tool-card">
                    <div class="tool-name">pcltopdf</div>
                    <div class="tool-status status-unavailable">未检测到</div>
                </div>
            </div>
        </div>
        
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📤</div>
            <p class="upload-text">点击或拖放.pcl文件到此处</p>
            <p style="color: #7f8c8d; font-size: 0.9rem; margin-top: 10px;">支持.pcl格式，最大100MB</p>
        </div>
        
        <input type="file" id="fileInput" class="file-input" accept=".pcl" onchange="handleFileSelect(event)">
        
        <div class="selected-file" id="selectedFile">
            <div class="file-icon">📄</div>
            <div class="file-info">
                <div class="file-name" id="fileName">未选择文件</div>
                <div class="file-size" id="fileSize"></div>
            </div>
            <button class="browse-btn" onclick="document.getElementById('fileInput').click()" style="padding: 8px 20px;">
                重新选择
            </button>
        </div>
        
        <button class="convert-btn" id="convertBtn" onclick="convertFile()" disabled>
            🚀 开始转换
        </button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <div class="progress-label">转换进度</div>
                <div class="progress-percent" id="progressPercent">0%</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div style="text-align: center; font-size: 0.9rem; color: #7f8c8d;" id="progressStatus">
                准备开始转换...
            </div>
        </div>
        
        <div class="result-container" id="resultContainer"></div>
        
        <footer>
            <p>FileBot Phase 2C - Windows部署包 | 版本: 2026.03.17</p>
            <p>技术支持: 请确保已安装PCL转换工具 (如GhostPCL)</p>
        </footer>
    </div>
    
    <div id="notificationContainer"></div>
    
    <script>
        // 全局变量
        let selectedFile = null;
        let conversionInProgress = false;
        let availableTools = [];
        
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const selectedFileDiv = document.getElementById('selectedFile');
        const fileNameSpan = document.getElementById('fileName');
        const fileSizeSpan = document.getElementById('fileSize');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressStatus = document.getElementById('progressStatus');
        const resultContainer = document.getElementById('resultContainer');
        const platformInfo = document.getElementById('platformInfo');
        const toolsCount = document.getElementById('toolsCount');
        const serviceStatus = document.getElementById('serviceStatus');
        const toolsGrid = document.getElementById('toolsGrid');
        const notificationContainer = document.getElementById('notificationContainer');
        
        // 显示通知
        function showNotification(message, type = 'info', duration = 5000) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            notificationContainer.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.5s ease reverse';
                setTimeout(() => notification.remove(), 500);
            }, duration);
        }
        
        // 检测可用工具
        function detectTools() {
            fetch('/api/tools')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        availableTools = data.tools || [];
                        
                        // 更新平台信息
                        platformInfo.textContent = data.platform || 'Unknown';
                        
                        // 更新工具计数
                        const count = availableTools.length;
                        toolsCount.textContent = `${count} 个工具`;
                        toolsCount.className = `card-content ${count > 0 ? 'status-online' : 'status-warning'}`;
                        
                        // 更新工具网格
                        updateToolsGrid(availableTools);
                        
                        // 更新服务状态
                        serviceStatus.textContent = '运行中';
                        serviceStatus.className = 'card-content status-online';
                        
                        if (count === 0) {
                            showNotification('⚠️ 未检测到PCL转换工具，请安装GhostPCL或其他工具', 'warning', 10000);
                        }
                    }
                })
                .catch(error => {
                    console.error('检测工具失败:', error);
                    serviceStatus.textContent = '异常';
                    serviceStatus.className = 'card-content status-offline';
                    showNotification('❌ 无法连接到服务，请检查应用是否运行', 'error');
                });
        }
        
        // 更新工具网格
        function updateToolsGrid(tools) {
            const toolCards = [
                { name: 'GhostPCL (gpcl6)', key: 'gpcl6' },
                { name: 'PCL6', key: 'pcl6' },
                { name: 'pcltopdf', key: 'pcltopdf' },
                { name: '其他工具', key: 'other' }
            ];
            
            toolsGrid.innerHTML = '';
            
            toolCards.forEach(tool => {
                const foundTool = tools.find(t => t.name === tool.key || tool.key === 'other');
                const isAvailable = !!foundTool;
                
                const toolCard = document.createElement('div');
                toolCard.className = `tool-card ${isAvailable ? 'available' : ''}`;
                toolCard.innerHTML = `
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-status ${isAvailable ? 'status-available' : 'status-unavailable'}">
                        ${isAvailable ? '✅ 可用' : '❌ 未检测到'}
                    </div>
                    ${isAvailable ? `<div style="font-size: 0.8rem; color: #7f8c8d; margin-top: 5px;">${foundTool.command}</div>` : ''}
                `;
                
                toolsGrid.appendChild(toolCard);
            });
        }
        
        // 刷新工具检测
        function refreshTools() {
            showNotification('🔄 正在重新检测PCL转换工具...', 'info');
            detectTools();
        }
        
        // 文件选择处理
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                processFile(file);
            }
        }
        
        // 处理文件
        function processFile(file) {
            // 验证文件类型
            if (!file.name.toLowerCase().endsWith('.pcl')) {
                showNotification('❌ 只支持.pcl文件', 'error');
                return;
            }
            
            // 验证文件大小（最大100MB）
            if (file.size > 100 * 1024 * 1024) {
                showNotification('❌ 文件太大（最大100MB）', 'error');
                return;
            }
            
            selectedFile = file;
            
            // 显示文件信息
            fileNameSpan.textContent = file.name;
            fileSizeSpan.textContent = formatFileSize(file.size);
            selectedFileDiv.classList.add('show');
            
            // 启用转换按钮
            convertBtn.disabled = false;
            
            showNotification(`✅ 已选择文件: ${file.name}`, 'success');
        }
        
        // 拖放功能
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;
                processFile(file);
            }
        });
        
        // 文件大小格式化
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 转换文件
        function convertFile() {
            if (!selectedFile || conversionInProgress) return;
            
            // 检查是否有可用工具
            if (availableTools.length === 0) {
                showNotification('❌ 未检测到PCL转换工具，请先安装工具', 'error');
                return;
            }
            
            // 重置UI
            resultContainer.style.display = 'none';
            resultContainer.className = 'result-container';
            
            // 显示进度条
            progressContainer.classList.add('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            progressStatus.textContent = '准备开始转换...';
            
            // 禁用按钮
            convertBtn.disabled = true;
            conversionInProgress = true;
            
            // 更新进度
            progressStatus.textContent = '正在上传文件...';
            updateProgress(10);
            
            // 创建FormData
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('conversion_method', 'local');
            
            // 发送请求
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateProgress(100);
                    progressStatus.textContent = '转换完成！';
                    
                    // 显示成功结果
                    resultContainer.innerHTML = `
                        <div class="result-header">
                            <div class="result-icon">🎉</div>
                            <div class="result-title">转换成功！</div>
                        </div>
                        <p><strong>原始文件:</strong> ${data.original_filename}</p>
                        <p><strong>输出文件:</strong> ${data.converted_filename}</p>
                        <p><strong>文件大小:</strong> ${formatFileSize(data.file_size)}</p>
                        <a href="${data.download_url}" class="download-btn" download="${data.converted_filename}">
                            📥 下载 ${data.converted_filename}
                        </a>
                    `;
                    resultContainer.classList.add('success');
                    resultContainer.style.display = 'block';
                    
                    showNotification('✅ 转换成功！可下载PDF文件', 'success');
                    
                    // 3秒后重置文件选择
                    setTimeout(() => {
                        selectedFileDiv.classList.remove('show');
                        selectedFile = null;
                        convertBtn.disabled = true;
                    }, 3000);
                } else {
                    updateProgress(0);
                    progressStatus.textContent = '转换失败';
                    
                    // 显示错误
                    resultContainer.innerHTML = `
                        <div class="result-header">
                            <div class="result-icon">❌</div>
                            <div class="result-title">转换失败</div>
                        </div>
                        <p><strong>错误信息:</strong> ${data.error}</p>
                        ${data.suggestion ? `<p><strong>建议:</strong> ${data.suggestion}</p>` : ''}
                    `;
                    resultContainer.classList.add('error');
                    resultContainer.style.display = 'block';
                    
                    showNotification(`❌ 转换失败: ${data.error}`, 'error');
                }
                
                // 重置状态
                conversionInProgress = false;
                convertBtn.disabled = false;
                
                // 5秒后隐藏进度条
                setTimeout(() => {
                    progressContainer.classList.remove('show');
                }, 5000);
            })
            .catch(error => {
                updateProgress(0);
                progressStatus.textContent = '网络错误';
                
                resultContainer.innerHTML = `
                    <div class="result-header">
                        <div class="result-icon">⚠️</div>
                        <div class="result-title">网络错误</div>
                    </div>
                    <p>连接服务器失败: ${error.message}</p>
                    <p>请检查应用是否正常运行</p>
                `;
                resultContainer.classList.add('error');
                resultContainer.style.display = 'block';
                
                showNotification('❌ 网络错误，请检查连接', 'error');
                
                conversionInProgress = false;
                convertBtn.disabled = false;
                progressContainer.classList.remove('show');
            });
        }
        
        // 更新进度
        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 检测工具
            detectTools();
            
            // 每30秒检测一次工具状态
            setInterval(detectTools, 30000);
            
            // 显示欢迎通知
            setTimeout(() => {
                showNotification('🚀 PCL转PDF转换器已就绪', 'success');
            }, 1000);
        });
    </script>
</body>
</html>
