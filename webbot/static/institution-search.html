<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institution Search — WebBot</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  header { background: #26374a; color: #fff; padding: 20px 24px; }
  header h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
  .search-row { display: flex; gap: 8px; max-width: 720px; }
  .search-row input { flex: 1; padding: 10px 12px; font-size: 16px; border: none; border-radius: 4px; }
  .search-row button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 4px; background: #f5c200; color: #26374a; font-weight: 600; cursor: pointer; }
  .search-row button:disabled { opacity: .6; cursor: default; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.15); padding: 16px 20px; margin-bottom: 16px; }
  .inst-title { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
  .inst-sub { color: #666; font-size: 13px; margin-bottom: 10px; }
  .count { display: inline-block; background: #e8f2f4; color: #26374a; border-radius: 12px; padding: 2px 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 8px 6px; border-top: 1px solid #eee; vertical-align: top; }
  .lang { color: #888; font-size: 12px; text-transform: uppercase; margin-left: 6px; }
  a.edit { white-space: nowrap; color: #26374a; font-weight: 600; text-decoration: none; }
  a.edit:hover { text-decoration: underline; }
  .hint { color: #666; font-size: 14px; }
  .error { background: #fdecea; color: #a33; padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; }
  .spinner { color: #666; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>🏛 Institution Search</h1>
  <div class="search-row">
    <input id="q" type="text" placeholder="Type an institution — e.g. Health Canada, CRA, Environment Canada, coast guard…" autofocus>
    <button id="go">Search</button>
  </div>
</header>
<main>
  <div id="status" class="hint">Type an institution name and press Search. Results are live WebBot pages — click <b>Edit</b> to open one in the editor.</div>
  <div id="results"></div>
</main>
<script>
const input = document.getElementById('q');
const go = document.getElementById('go');
const status = document.getElementById('status');
const results = document.getElementById('results');

async function search() {
  const q = input.value.trim();
  if (!q) return;
  go.disabled = true;
  status.textContent = 'Searching…';
  results.innerHTML = '';
  try {
    const resp = await fetch('/api/v1/search/institution-news?q=' + encodeURIComponent(q) + '&limit=50');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.match_count === 0) {
      status.innerHTML = 'No institution found for <b>' + escapeHtml(q) + '</b>. Try a different name (EN or FR).';
      return;
    }
    status.textContent = data.match_count + ' institution(s) matched — ' + q;
    let html = '';
    for (const m of data.matches) {
      html += '<div class="card">'
        + '<div class="inst-title">' + escapeHtml(m.name_en) + '</div>'
        + '<div class="inst-sub">' + escapeHtml(m.name_fr || '') + ' · segment <code>/canadasite/en/' + escapeHtml(m.segment) + '</code></div>'
        + '<div class="count">' + m.page_count + ' published ' + (m.news_only ? 'news' : '') + ' page(s)</div>'
        + '<table>';
      for (const p of m.pages) {
        const title = p.title && p.title !== 'Untitled' ? p.title : p.path.split('/').pop();
        html += '<tr><td>' + escapeHtml(title) + '<span class="lang">' + escapeHtml(p.language) + '</span></td>'
          + '<td style="text-align:right"><a class="edit" href="' + escapeHtml(p.edit_url) + '" target="_blank">Edit ↗</a></td></tr>';
      }
      html += '</table></div>';
    }
    results.innerHTML = html;
  } catch (e) {
    status.innerHTML = '';
    results.innerHTML = '<div class="error">Search failed: ' + escapeHtml(e.message) + '</div>';
  } finally {
    go.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

go.addEventListener('click', search);
input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>
</body>
</html>
