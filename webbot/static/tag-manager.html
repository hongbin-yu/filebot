<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Manager - Canada.ca</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px 30px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #2572b4;
        }
        .header h1 { font-size: 22px; color: #2572b4; }
        .header h1 small { font-size: 13px; color: #999; font-weight: normal; margin-left: 10px; }

        .main-container { display: flex; gap: 20px; height: calc(100vh - 100px); }

        /* ===== Left Panel — Root Tags ===== */
        .left-panel {
            width: 300px;
            flex-shrink: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }
        .left-panel .panel-header {
            padding: 12px 16px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .left-panel .panel-header h2 { font-size: 15px; font-weight: 600; }
        .left-panel .panel-header .badge { background: #2572b4; color: white; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
        .left-panel .panel-body { flex: 1; overflow-y: auto; padding: 0; }
        .root-list { list-style: none; margin: 0; padding: 0; }
        .root-list .root-item {
            padding: 10px 14px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.1s;
        }
        .root-list .root-item:hover { background: #f0f7ff; }
        .root-list .root-item.selected { background: #e6f2ff; border-left: 3px solid #2572b4; }
        .root-list .root-item .root-icon { font-size: 18px; flex-shrink: 0; }
        .root-list .root-item .root-info { flex: 1; min-width: 0; }
        .root-list .root-item .root-info .root-id { font-weight: 600; font-size: 13px; color: #333; }
        .root-list .root-item .root-info .root-meta { font-size: 11px; color: #aaa; margin-top: 1px; }
        .root-list .root-item .root-chevron { color: #ccc; font-size: 14px; }
        .empty-root {
            text-align: center; color: #bbb; padding: 40px 20px; font-size: 14px;
        }

        /* ===== Right Panel — Children & Editor ===== */
        .right-panel {
            flex: 1;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }
        .right-panel .panel-header {
            padding: 12px 16px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .right-panel .panel-header h2 { font-size: 15px; font-weight: 600; }
        .right-panel .panel-header h2 .current-type { color: #2572b4; }
        .right-panel .panel-body { flex: 1; overflow-y: auto; padding: 0; }

        .right-placeholder {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: #bbb; font-size: 16px;
            flex-direction: column; gap: 10px;
        }
        .right-placeholder .big-icon { font-size: 40px; }

        /* Tag row in children panel */
        .tag-row {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.1s;
        }
        .tag-row:hover { background: #f9fbff; }
        .tag-row .tag-indent { width: calc(var(--depth, 0) * 20px); flex-shrink: 0; }
        .tag-row .toggle-btn {
            width: 18px; height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #aaa;
            cursor: pointer;
            flex-shrink: 0;
            margin-right: 4px;
            user-select: none;
        }
        .tag-row .toggle-btn:hover { color: #555; }
        .tag-row .tag-label { flex: 1; min-width: 0; }
        .tag-row .tag-label .tag-id { font-weight: 600; font-size: 13px; color: #333; }
        .tag-row .tag-label .tag-fr { color: #888; font-size: 12px; margin-left: 5px; }
        .tag-row .tag-label .tag-type {
            display: inline-block;
            font-size: 10px; color: #fff; background: #2572b4;
            border-radius: 3px; padding: 0 5px; margin-left: 4px; vertical-align: middle;
        }
        .tag-row .tag-label .tag-meta { font-size: 11px; color: #aaa; margin-left: 6px; }
        .tag-row .tag-label .tag-desc { display: block; color: #aaa; font-size: 11px; margin-top: 1px; }
        .tag-row .tag-actions {
            display: flex; gap: 3px; flex-shrink: 0;
            opacity: 0; transition: opacity 0.15s;
        }
        .tag-row:hover .tag-actions { opacity: 1; }
        .tag-row .tag-actions button {
            padding: 1px 6px; font-size: 11px;
            border: 1px solid #ddd; border-radius: 3px; background: white; cursor: pointer;
        }
        .tag-row .tag-actions button:hover { background: #f5f5f5; }
        .tag-row .tag-actions .btn-add-child:hover { border-color: #5cb85c; color: #4cae4c; }
        .tag-row .tag-actions .btn-edit:hover { border-color: #5bc0de; color: #31708f; }
        .tag-row .tag-actions .btn-del:hover { border-color: #d9534f; color: #c9302c; }

        .empty-children {
            text-align: center; color: #bbb; padding: 40px 20px; font-size: 14px;
        }

        /* ===== Toolbar ===== */
        .toolbar {
            display: flex; gap: 6px; align-items: center;
            padding: 8px 14px; border-bottom: 1px solid #eee; background: #fcfcfc;
        }
        .toolbar button {
            padding: 4px 12px; font-size: 12px;
            border: 1px solid #ddd; border-radius: 4px;
            background: white; cursor: pointer;
        }
        .toolbar button:hover { background: #f0f0f0; }

        .btn-primary { background: #2572b4; color: white; border: 1px solid #1a5a8c; }
        .btn-primary:hover { background: #1a5a8c; }
        .btn-success { background: #28a745; color: white; border: 1px solid #1e7e34; }
        .btn-success:hover { background: #1e7e34; }
        .btn-danger { background: #dc3545; color: white; border: 1px solid #b52d3a; }
        .btn-danger:hover { background: #b52d3a; }
        .btn-default { background: #f8f8f8; color: #333; border: 1px solid #ddd; }
        .btn-default:hover { background: #eee; }

        /* ===== Inline Editor ===== */
        .tag-editor {
            padding: 10px 14px;
            margin: 6px 10px;
            background: #fffef5;
            border: 1px solid #e6d9a0;
            border-radius: 4px;
        }
        .tag-editor .row { display: flex; gap: 10px; margin-bottom: 6px; align-items: center; }
        .tag-editor .row label { width: 80px; font-size: 12px; font-weight: 600; color: #555; flex-shrink: 0; }
        .tag-editor .row input, .tag-editor .row select {
            flex: 1; padding: 4px 8px;
            border: 1px solid #ccc; border-radius: 3px; font-size: 13px;
        }
        .tag-editor .btn-row { margin-top: 6px; display: flex; gap: 6px; }
        .tag-editor .btn-row button { padding: 4px 12px; font-size: 12px; border-radius: 3px; cursor: pointer; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            padding: 10px 18px; border-radius: 4px; margin-bottom: 6px; font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); animation: fadeIn 0.3s;
        }
        .toast.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .toast.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .toast.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; } }
    </style>
<script src="/static/js/webbot-auth.js"></script>
</head>
<body>

<div class="header">
    <h1>🏷️ Tag Manager <small>subject · audience · any child tags</small></h1>
</div>

<div class="main-container">
    <!-- Left: Root tags -->
    <div class="left-panel">
        <div class="panel-header">
            <h2>Root Tags <span class="badge" id="root-count">0</span></h2>
            <button class="btn btn-primary" id="add-root-btn" style="padding:3px 10px;font-size:12px;">+ Add</button>
        </div>
        <div class="panel-body">
            <div id="root-list-container"><div class="empty-root">Loading...</div></div>
        </div>
    </div>

    <!-- Right: Children of selected root -->
    <div class="right-panel">
        <div class="panel-header">
            <h2 id="right-title">Select a root tag to view <span class="current-type"></span></h2>
            <button class="btn btn-primary" id="add-child-btn" style="padding:3px 10px;font-size:12px;display:none;">+ Add Child</button>
        </div>
        <div class="toolbar" id="right-toolbar" style="display:none;">
            <button onclick="expandAllChildren()">▶ Expand All</button>
            <button onclick="collapseAllChildren()">▼ Collapse All</button>
            <button onclick="editRootTag()">✏️ Edit Root</button>
            <button onclick="deleteRootTag()" class="btn-danger" style="margin-left:auto">🗑️ Delete Root</button>
        </div>
        <div class="panel-body" id="right-body">
            <div class="right-placeholder">
                <div class="big-icon">👈</div>
                <div>Select a root tag from the left panel</div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API = '/api/v1/tags';

var allTags = [];
var selectedRootId = null;
var expandedMap = {};

function showToast(msg, type) {
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'info');
    t.textContent = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(function() { t.remove(); }, 3000);
}

function loadTags() {
    fetch(API + '?flat=true')
        .then(function(r) { return r.ok ? r.json() : []; })
        .then(function(tags) {
            allTags = tags;
            renderRootList(tags);
            if (selectedRootId) {
                var stillExists = tags.some(function(t) { return t.id === selectedRootId; });
                if (stillExists) renderChildren(selectedRootId, tags);
                else selectRoot(null);
            }
        })
        .catch(function(err) { showToast('Failed to load tags: ' + err.message, 'error'); });
}

// ===== Left Panel: Root Tags =====
function renderRootList(tags) {
    // Show root tags that ARE their own type (category tags like subject, audience, departments)
    // A tag is a 'category root' if id === type — it's the category itself, not data within it
    var roots = tags.filter(function(t) { return !t.parent_id && t.type && t.id === t.type; });
    roots.sort(function(a,b) { return a.id < b.id ? -1 : 1; });

    document.getElementById('root-count').textContent = roots.length;

    if (!roots.length) {
        // Check if subject and audience already exist as non-root tags
        var hasSubject = tags.some(function(t) { return t.id === 'subject'; });
        var hasAudience = tags.some(function(t) { return t.id === 'audience'; });
        document.getElementById('root-list-container').innerHTML =
            '<div class="empty-root">Root tags missing.<br>' +
            '<button class="btn btn-primary" style="margin-top:8px;font-size:12px;padding:4px 12px;" ' +
            'onclick="createDefaultRoots()">Initialize subject + audience</button></div>';
        return;
    }

    var html = '<ul class="root-list">';
    roots.forEach(function(t) {
        var childCount = tags.filter(function(c) { return c.parent_id === t.id; }).length;
        var pageCount = t.page_count || 0;
        var meta = [];
        if (childCount > 0) meta.push(childCount + ' child');
        if (pageCount > 0) meta.push(pageCount + ' pages');
        html += '<li class="root-item' + (t.id === selectedRootId ? ' selected' : '') +
                '" onclick="selectRoot(\'' + t.id + '\')" data-root-id="' + t.id + '">' +
            '<span class="root-icon">📂</span>' +
            '<div class="root-info">' +
                '<div class="root-id">' + esc(t.id) + '</div>' +
                '<div class="root-meta">' + meta.join(' · ') + '</div>' +
            '</div>' +
            '<span class="root-chevron">›</span>' +
        '</li>';
    });
    html += '</ul>';
    document.getElementById('root-list-container').innerHTML = html;
}

function selectRoot(rootId) {
    selectedRootId = rootId;
    renderRootList(allTags);
    if (rootId) {
        renderChildren(rootId, allTags);
    } else {
        document.getElementById('right-title').innerHTML = '<span class="current-type" style="color:#999">Select a root tag</span>';
        document.getElementById('right-body').innerHTML =
            '<div class="right-placeholder"><div class="big-icon">👈</div><div>Select a root tag from the left panel</div></div>';
        document.getElementById('right-toolbar').style.display = 'none';
        document.getElementById('add-child-btn').style.display = 'none';
    }
}

// ===== Right Panel: Children (flat tree under selected root) =====
function renderChildren(rootId, tags) {
    // rootId is 'subject' or 'audience'
    // Find all tags with matching type (excluding the category meta-tag itself)
    var typeTags = tags.filter(function(t) {
        return t.type === rootId && t.id !== rootId;
    });

    document.getElementById('right-title').innerHTML =
        '<span class="current-type" style="color:#2572b4">' + esc(rootId) + '</span> tags';
    document.getElementById('right-toolbar').style.display = 'flex';
    document.getElementById('add-child-btn').style.display = 'inline-block';
    document.getElementById('add-child-btn').onclick = function() { addChild(rootId); };

    // Build nested tree using parent_id for nesting within the type
    var tree = buildTypeTree(typeTags, tags);

    if (tree.length === 0) {
        document.getElementById('right-body').innerHTML =
            '<div class="empty-children">No ' + esc(rootId) + ' tags yet.<br>Click "+ Add Child" to add one.</div>';
        return;
    }

    document.getElementById('right-body').innerHTML = renderChildRows(tree, 0);
}

function buildTypeTree(typeTags, allTags) {
    // typeTags: tags filtered by the selected type
    // Build a tree from parent_id relationships among typeTags
    var map = {};
    var roots = [];

    // Initialize all typeTags in map
    typeTags.forEach(function(t) { map[t.id] = t; t._children = []; });

    // Build parent-child relationships using parent_id
    typeTags.forEach(function(t) {
        var pid = t.parent_id;
        if (pid && map[pid]) {
            // Has a valid parent within this type
            map[pid]._children.push(t);
        } else {
            // No parent, or parent not in this type → root-level within this type
            roots.push(t);
        }
    });

    // Sort
    Object.values(map).forEach(function(n) {
        n._children.sort(function(a,b) { return a.id < b.id ? -1 : 1; });
    });
    roots.sort(function(a,b) { return a.id < b.id ? -1 : 1; });

    return roots;
}

function renderChildRows(nodes, depth) {
    var html = '';
    nodes.forEach(function(tag) {
        var key = tag.id;
        var hasChildren = tag._children && tag._children.length > 0;
        var isExpanded = expandedMap[key];

        var toggleBtn = hasChildren
            ? '<span class="toggle-btn" onclick="toggleChildExpand(\'' + key + '\')">' + (isExpanded ? '▼' : '▶') + '</span>'
            : '<span class="toggle-btn" style="visibility:hidden">▶</span>';

        var counts = [];
        if (tag.children_count > 0) counts.push(tag.children_count + ' sub');
        if (tag.page_count > 0) counts.push(tag.page_count + ' pages');
        var countStr = counts.length ? ' <span class="tag-meta">(' + counts.join(', ') + ')</span>' : '';

        var typeBadge = tag.type ? ' <span class="tag-type">' + esc(tag.type) + '</span>' : '';

        html += '<div class="tag-row" style="--depth:' + depth + '">' +
            '<div class="tag-indent"></div>' +
            toggleBtn +
            '<div class="tag-label">' +
                '<span class="tag-id">' + esc(tag.id) + '</span>' +
                (tag.label_fr ? '<span class="tag-fr">(' + esc(tag.label_fr) + ')</span>' : '') +
                typeBadge +
                countStr +
                (tag.description ? '<span class="tag-desc">' + esc(tag.description) + '</span>' : '') +
            '</div>' +
            '<div class="tag-actions">' +
                '<button class="btn-add-child" onclick="event.stopPropagation(); addChild(\'' + tag.id + '\')" title="Add child">+</button>' +
                '<button class="btn-edit" onclick="event.stopPropagation(); openEditTag(\'' + tag.id + '\')" title="Edit">✏️</button>' +
                '<button class="btn-del" onclick="event.stopPropagation(); deleteTag(\'' + tag.id + '\')" title="Delete">🗑️</button>' +
            '</div>' +
        '</div>';

        if (hasChildren && isExpanded) {
            html += renderChildRows(tag._children, depth + 1);
        }
    });
    return html;
}

// ===== Expand / Collapse =====
function toggleChildExpand(key) {
    if (expandedMap[key]) { delete expandedMap[key]; }
    else { expandedMap[key] = true; }
    if (selectedRootId) renderChildren(selectedRootId, allTags);
}

function expandAllChildren() {
    if (!selectedRootId) return;
    // Expand all descendants
    var rootTag = allTags.find(function(t) { return t.id === selectedRootId; });
    function expandRecursive(parentId) {
        allTags.forEach(function(t) {
            if (t.parent_id === parentId) {
                expandedMap[t.id] = true;
                expandRecursive(t.id);
            }
        });
    }
    expandRecursive(selectedRootId);
    renderChildren(selectedRootId, allTags);
}

function collapseAllChildren() {
    if (!selectedRootId) return;
    // Only collapse children of the selected root
    allTags.forEach(function(t) {
        var p = t.parent_id;
        while (p) {
            if (p === selectedRootId) { delete expandedMap[t.id]; break; }
            var pt = allTags.find(function(x) { return x.id === p; });
            p = pt ? pt.parent_id : null;
        }
    });
    renderChildren(selectedRootId, allTags);
}

// ===== Root Tag Actions =====
function editRootTag() {
    if (!selectedRootId) return;
    openEditTag(selectedRootId);
}

function deleteRootTag() {
    if (!selectedRootId) return;
    deleteTag(selectedRootId);
}

// ===== Inline Editor =====
function openEditTag(tagId) {
    closeAllEditors();
    var tag = allTags.find(function(t) { return t.id === tagId; });
    if (!tag) return;

    var container = document.getElementById('right-body');

    var editor = document.createElement('div');
    editor.className = 'tag-editor';
    editor.setAttribute('data-edit-id', tagId);
    editor.innerHTML = buildEditForm(tag);
    container.insertBefore(editor, container.firstChild);
}

function addChild(parentId) {
    closeAllEditors();
    expandedMap[parentId] = true;
    if (selectedRootId) renderChildren(selectedRootId, allTags);

    var container = document.getElementById('right-body');
    var editor = document.createElement('div');
    editor.className = 'tag-editor';
    editor.setAttribute('data-edit-id', '__new__');
    editor.innerHTML = buildNewForm(parentId);
    container.insertBefore(editor, container.firstChild);
}

function buildEditForm(tag) {
    var parentOpts = '<option value="">(none — root level)</option>';
    allTags.forEach(function(t) {
        if (t.id === tag.id) return;
        parentOpts += '<option value="' + t.id + '"' + (t.id === tag.parent_id ? ' selected' : '') + '>' + t.id + '</option>';
    });
    return '<div class="row"><label>ID:</label><input class="ed-id" value="' + esc(tag.id) + '" readonly style="background:#f5f5f5;"></div>' +
        '<div class="row"><label>Type:</label><input class="ed-type" value="' + esc(tag.type || '') + '" placeholder="e.g. subject, audience"></div>' +
        '<div class="row"><label>FR Label:</label><input class="ed-fr" value="' + esc(tag.label_fr || '') + '"></div>' +
        '<div class="row"><label>Description:</label><input class="ed-desc" value="' + esc(tag.description || '') + '"></div>' +
        '<div class="row"><label>Desc FR:</label><input class="ed-desc-fr" value="' + esc(tag.description_fr || '') + '"></div>' +
        '<div class="row"><label>Parent:</label><select class="ed-parent">' + parentOpts + '</select></div>' +
        '<div class="btn-row">' +
            '<button class="btn btn-success" onclick="saveEdit(\'' + tag.id + '\')">💾 Save</button>' +
            '<button class="btn btn-default" onclick="closeEditor()">Cancel</button>' +
        '</div>';
}

function buildNewForm(parentId) {
    var parentTag = allTags.find(function(t) { return t.id === parentId; });
    var defaultType = parentTag ? (parentTag.type || '') : '';

    var parentOpts = '';
    if (!parentId) {
        parentOpts = '<option value="">(none — root level)</option>';
        allTags.forEach(function(t) {
            parentOpts += '<option value="' + t.id + '">' + t.id + '</option>';
        });
    } else {
        parentOpts = '<option value="" disabled>Child of ' + parentId + '</option>' +
            '<option value="' + parentId + '" selected hidden>' + parentId + '</option>';
    }

    return '<div class="row"><label>Tag ID:</label><input class="ed-id" placeholder="english-slug" style="font-family:monospace"></div>' +
        (parentId ? '' : '<div class="row"><label>Type:</label><input class="ed-type" value="' + defaultType + '" placeholder="e.g. subject, audience"></div>') +
        '<div class="row"><label>FR Label:</label><input class="ed-fr" placeholder="Étiquette française"></div>' +
        '<div class="row"><label>Description:</label><input class="ed-desc" placeholder="English description (optional)"></div>' +
        '<div class="row"><label>Desc FR:</label><input class="ed-desc-fr" placeholder="Description française (optional)"></div>' +
        (parentId ? '' : '<div class="row"><label>Parent:</label><select class="ed-parent">' + parentOpts + '</select></div>') +
        '<div class="btn-row">' +
            '<button class="btn btn-primary" onclick="createTag(\'' + (parentId || '') + '\')">➕ Create</button>' +
            '<button class="btn btn-default" onclick="closeEditor()">Cancel</button>' +
        '</div>';
}

function closeAllEditors() {
    document.querySelectorAll('.tag-editor').forEach(function(el) { el.remove(); });
}

function closeEditor() {
    document.querySelectorAll('.tag-editor').forEach(function(el) { el.remove(); });
}

// ===== CRUD =====
function saveEdit(tagId) {
    var editor = document.querySelector('.tag-editor[data-edit-id="' + tagId + '"]');
    if (!editor) return;

    var payload = {
        type: (editor.querySelector('.ed-type') || {}).value || null,
        label_fr: (editor.querySelector('.ed-fr') || {}).value || '',
        description: (editor.querySelector('.ed-desc') || {}).value || '',
        description_fr: (editor.querySelector('.ed-desc-fr') || {}).value || '',
        parent_id: (editor.querySelector('.ed-parent') || {}).value || null
    };

    fetch(API + '/' + encodeURIComponent(tagId), {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Save failed'); });
        return r.json();
    })
    .then(function() {
        showToast('✅ Saved: ' + tagId, 'success');
        closeEditor();
        loadTags();
    })
    .catch(function(err) { showToast('❌ ' + err.message, 'error'); });
}

function deleteTag(tagId) {
    var tag = allTags.find(function(t) { return t.id === tagId; });
    var msg = 'Delete tag "' + tagId + '"?';
    if (tag && tag.children_count > 0) {
        msg += '\n\n⚠️ This tag has ' + tag.children_count + ' child tag(s) — they will NOT be deleted but will become orphaned.';
    }
    if (tag && tag.page_count > 0) {
        msg += '\n\n⚠️ Used by ' + tag.page_count + ' page(s) — tag will be removed from those pages.';
    }
    if (!confirm(msg)) return;

    var tagPath = tag ? tag.path : tagId;
    fetch(API + '?path=' + encodeURIComponent(tagPath), { method: 'DELETE' })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Delete failed'); });
        return r.json();
    })
    .then(function() {
        showToast('🗑️ Deleted: ' + tagId, 'info');
        delete expandedMap[tagId];
        if (selectedRootId === tagId) selectedRootId = null;
        loadTags();
    })
    .catch(function(err) { showToast('❌ ' + err.message, 'error'); });
}

function createTag(parentId) {
    var editor = document.querySelector('.tag-editor[data-edit-id="__new__"]');
    if (!editor) { showToast('❌ No create form open', 'error'); return; }

    var idVal = (editor.querySelector('.ed-id') || {}).value || '';
    var typeVal = (editor.querySelector('.ed-type') || {}).value || '';
    var frVal = (editor.querySelector('.ed-fr') || {}).value || '';
    var descVal = (editor.querySelector('.ed-desc') || {}).value || '';
    var descFrVal = (editor.querySelector('.ed-desc-fr') || {}).value || '';
    var parentVal = (editor.querySelector('.ed-parent') || {}).value || null;

    if (!idVal.trim()) { showToast('❌ Tag ID is required', 'error'); return; }
    if (!/^[a-z0-9][a-z0-9-]*$/.test(idVal.trim())) {
        showToast('❌ Tag ID must be lowercase alphanumeric with hyphens', 'error');
        return;
    }

    var tid = idVal.trim();
    var payload = {
        id: tid,
        type: typeVal.trim() || null,
        label_fr: frVal.trim() || tid,
        description: descVal.trim(),
        description_fr: descFrVal.trim()
    };
    if (parentVal) {
        payload.parent_id = parentVal;
    } else if (parentId) {
        // Adding child under a root category
        var parentTag = allTags.find(function(t) { return t.id === parentId; });
        if (parentTag && !parentTag.parent_id) {
            // Root tag as parent → set type, not parent_id
            if (!payload.type) payload.type = parentId;
        } else {
            payload.parent_id = parentId;
        }
    } else {
        // Creating a new root tag — auto-set type = id if not specified
        if (!payload.type) payload.type = tid;
    }

    fetch(API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Create failed'); });
        return r.json();
    })
    .then(function() {
        showToast('✅ Created: ' + idVal.trim(), 'success');
        closeEditor();
        loadTags();
    })
    .catch(function(err) { showToast('❌ ' + err.message, 'error'); });
}

function createDefaultRoots() {
    var payloads = [
        { id: 'subject', type: 'subject', label_fr: 'Sujets' },
        { id: 'audience', type: 'audience', label_fr: 'Publics' }
    ];
    var pending = payloads.length;
    payloads.forEach(function(p) {
        fetch(API, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(p)
        })
        .then(function(r) {
            if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'Create failed'); });
            return r.json();
        })
        .then(function() {
            showToast('✅ Created: ' + p.id, 'success');
            pending--;
            if (pending === 0) loadTags();
        })
        .catch(function(err) {
            showToast('❌ ' + err.message, 'error');
            pending--;
        });
    });
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', function() {
    loadTags();

    document.getElementById('add-root-btn').addEventListener('click', function() {
        closeAllEditors();
        selectRoot(null);
        // Insert editor after selectRoot clears the placeholder
        var container = document.getElementById('right-body');
        container.innerHTML = '';
        var editor = document.createElement('div');
        editor.className = 'tag-editor';
        editor.setAttribute('data-edit-id', '__new__');
        editor.innerHTML = buildNewForm(null);
        container.appendChild(editor);
    });
});
</script>
