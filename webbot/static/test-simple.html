<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .status { background: #e0e0e0; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Simple Test Page</h1>
    <p>If you can see this, the server is working.</p>
    
    <div class="status" id="status1">
        Testing basic JavaScript...
    </div>
    
    <div class="status" id="status2">
        Testing fetch API...
    </div>
    
    <script>
        // Test 1: Basic JavaScript
        try {
            document.getElementById('status1').className = 'status success';
            document.getElementById('status1').textContent = '✓ Basic JavaScript works';
        } catch (e) {
            document.getElementById('status1').className = 'status error';
            document.getElementById('status1').textContent = '✗ JavaScript error: ' + e.message;
        }
        
        // Test 2: Fetch API
        fetch('/api/v1/pages/by-path?path=%2Fen%2Fsocial')
            .then(response => {
                if (response.ok) {
                    document.getElementById('status2').className = 'status success';
                    document.getElementById('status2').textContent = '✓ API works (Status: ' + response.status + ')';
                } else {
                    document.getElementById('status2').className = 'status error';
                    document.getElementById('status2').textContent = '✗ API error (Status: ' + response.status + ')';
                }
            })
            .catch(error => {
                document.getElementById('status2').className = 'status error';
                document.getElementById('status2').textContent = '✗ Network error: ' + error.message;
            });
    </script>
</body>
</html>
