<!DOCTYPE html>
<html>
<head>
    <title>Simple Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>WebBot Server Test</h1>
    
    <div id="status1" class="status loading">Testing server connection...</div>
    <div id="status2" class="status loading">Testing API endpoint...</div>
    <div id="status3" class="status loading">Testing editor.html...</div>
    
    <h2>Test Links</h2>
    <ul>
        <li><a href="/editor.html" target="_blank">Editor (no static)</a></li>
        <li><a href="/static/editor.html" target="_blank">Static Editor</a></li>
        <li><a href="/static/editor.html?path=/en/mobile" target="_blank">Editor with path</a></li>
        <li><a href="/navigation.html" target="_blank">Navigation</a></li>
    </ul>
    
    <script>
        async function testEndpoint(url, elementId) {
            const element = document.getElementById(elementId);
            try {
                const start = Date.now();
                const response = await fetch(url);
                const time = Date.now() - start;
                
                if (response.ok) {
                    element.textContent = `✅ ${url} → ${response.status} OK (${time}ms)`;
                    element.className = 'status success';
                } else {
                    element.textContent = `❌ ${url} → ${response.status} ${response.statusText} (${time}ms)`;
                    element.className = 'status error';
                }
            } catch (error) {
                element.textContent = `❌ ${url} → Error: ${error.message}`;
                element.className = 'status error';
            }
        }
        
        // Run tests
        setTimeout(() => testEndpoint('/', 'status1'), 100);
        setTimeout(() => testEndpoint('/api/v1/pages/by-path?path=/en/mobile', 'status2'), 200);
        setTimeout(() => testEndpoint('/static/editor.html', 'status3'), 300);
    </script>
</body>
</html>
