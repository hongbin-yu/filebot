<!DOCTYPE html>
<html class="no-js" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WebBot Page Navigation</title>
    
    <!-- Canada.ca WET theme CSS -->
    <link rel="stylesheet" href="https://www.canada.ca/etc/designs/canada/wet-boew/css/theme.min.css">
    <link rel="stylesheet" href="https://www.canada.ca/etc/designs/canada/wet-boew/css/wet-boew.min.css">
    
    <!-- Simple custom styles -->
    <style>
        /* Hide Canada.ca default header/footer elements */
        #wb-bnr, #wb-sm, #wb-info, #wb-srch, #wb-lng, .wb-srch, .gcweb-menu, #gcwu-sig {
            display: none !important;
        }
        
        /* Simple container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .header h1 {
            margin: 0;
            color: #333;
        }
        
        .header p {
            color: #666;
            margin: 10px 0 0 0;
        }
        
        /* Page list */
        .page-list-container {
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
            padding: 20px;
        }
        
        .page-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .page-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .page-item:last-child {
            border-bottom: none;
        }
        
        .page-item:hover {
            background-color: #f0f7ff;
        }
        
        .page-item.active {
            background-color: #e1f0ff;
            border-left: 3px solid #0078d4;
        }
        
        .page-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 3px;
        }
        
        .page-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #555;
        }
        
        .error {
            background: #f2dede;
            color: #a94442;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            border: 1px solid #ebccd1;
        }
        
        /* Status indicators */
        .status-draft {
            color: #856404;
            background-color: #fff3cd;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .status-published {
            color: #155724;
            background-color: #d4edda;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .language-en {
            color: #0c5460;
            background-color: #d1ecf1;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .language-fr {
            color: #721c24;
            background-color: #f8d7da;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
    </style>
</head>
<body vocab="http://schema.org/" resource="#wb-webpage" typeof="WebPage">
    <div class="container">
        <div class="header">
            <h1>WebBot Page Navigation</h1>
            <p>Select a page to edit. Simple list view showing all pages.</p>
        </div>
        
        <div class="page-list-container">
            <div id="loading" class="loading">Loading pages...</div>
            <div id="error" class="error" style="display: none;"></div>
            <ul id="page-list" class="page-list" style="display: none;"></ul>
        </div>
    </div>

    <!-- Canada.ca WET theme JS -->
    <script src="https://www.canada.ca/etc/designs/canada/wet-boew/js/wet-boew.min.js"></script>
    <script src="https://www.canada.ca/etc/designs/canada/wet-boew/js/theme.min.js"></script>
    
    <!-- Simple navigation logic -->
    <script>
        const API_BASE = '/api/v1/pages';
        let allPages = [];
        let selectedPageId = null;
        
        // Load pages on startup
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(API_BASE);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                allPages = await response.json();
                
                // Hide loading, show list
                document.getElementById('loading').style.display = 'none';
                document.getElementById('page-list').style.display = 'block';
                
                renderPageList();
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorEl = document.getElementById('error');
                errorEl.textContent = `Failed to load pages: ${error.message}`;
                errorEl.style.display = 'block';
                console.error('Error loading pages:', error);
            }
        });
        
        // Render simple page list
        function renderPageList() {
            const listEl = document.getElementById('page-list');
            listEl.innerHTML = '';
            
            // Sort pages by title
            const sortedPages = [...allPages].sort((a, b) => a.title.localeCompare(b.title));
            
            sortedPages.forEach(page => {
                const li = document.createElement('li');
                li.className = 'page-item';
                if (page.id === selectedPageId) {
                    li.classList.add('active');
                }
                
                li.innerHTML = `
                    <div class="page-title">${escapeHtml(page.title || page.id)}</div>
                    <div class="page-meta">
                        <span>ID: ${escapeHtml(page.id)}</span>
                        <span class="language-${page.language || 'en'}">${page.language || 'en'}</span>
                        <span class="status-${page.status || 'draft'}">${page.status || 'draft'}</span>
                        ${page.children && page.children.length > 0 ? `<span>${page.children.length} child pages</span>` : ''}
                    </div>
                `;
                
                li.addEventListener('click', () => {
                    selectPage(page.id);
                });
                
                listEl.appendChild(li);
            });
        }
        
        // Select a page and navigate to editor
        function selectPage(pageId) {
            selectedPageId = pageId;
            renderPageList();
            
            // Navigate to editor after a brief delay for visual feedback
            setTimeout(() => {
                window.location.href = `editor.html?pageId=${encodeURIComponent(pageId)}`;
            }, 200);
        }
        
        // Simple HTML escaping
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
